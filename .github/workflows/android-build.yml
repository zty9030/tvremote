name: Android Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created, published ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
    
    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
    
    - name: Configure Android NDK Path
      run: |
        echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
    
    - name: Run make android
      run: make android
    
    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tvremote
        path: build/tvremote

    - name: Update Latest Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: ncipollo/release-action@v1
      with:
        tag: latest
        name: Latest Build
        makeLatest: true
        allowUpdates: true
        replacesArtifacts: true
        artifacts: build/tvremote
        body: "Latest build from main branch - Commit: ${{ github.sha }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: build/tvremote
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}